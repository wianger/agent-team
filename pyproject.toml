[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-team"
version = "0.2.0"
description = "A shared conversation room for humans, Claude Code, and Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["prompt-toolkit>=3.0.48,<4"]

[project.scripts]
agent-team = "agent_team.cli:main"

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109", "ASYNC110"]
